substitutions:
  device_name: ha-voice-test
  friendly: HA-Voice-Test
  wake_word_priority: 14  # 0-255, bigger is higher priority. Only used if wake word sliding average probability is equal
  mic_select: "right"     # "left"-mic1-MIC1P/MIC1N, "right"-mic2-MIC2P/MIC2N, "stereo"?? (viewed from the power connector side)
                          # Office-14-R, family-10-L, Kitchen-12-R, Home1-8-R, Home2-6-R, Master-4-L, Bathroom-2-L 

  # Device arbitration delays wake word response. 
  # Delay will be (udp_send_count-1)*udp_send_delay
  # Set udp_send_count to 0 to disable arbitration if you're device is not in hearing proximity of other devices
  udp_broadcast_ip: 10.10.255.255   # subnet broadcast. Depends on network mask for 255.255.255.0 use x.x.x.255
  udp_broadcast_port: 44808         # random change if it conflicts
  udp_send_delay: "100ms"
  udp_send_count: 5

  wake1_name: "Home Assistant"
  wake1_id:    home_assistant

  wake2_name: "Hey Grok"
  wake2_id:    hey_grok

  wake1_model: /config/esphome/wakewords/$wake1_id.json
  wake2_model: /config/esphome/wakewords/$wake2_id.json
  
  wake_cutoff_slight: "250"     # ~0.98
  wake_cutoff_moderate: "245"   # ~0.96
  wake_cutoff_very: "222"       # ~0.87

  # Phases of the Voice Assistant
  voice_assist_idle_phase_id: '1' # ready to be triggered by a wake word
  voice_assist_waiting_for_command_phase_id: '2' # waiting for a voice command (after being triggered by the wake word)
  voice_assist_listening_for_command_phase_id: '3' # listening for a voice command
  voice_assist_thinking_phase_id: '4' # processing the command
  voice_assist_replying_phase_id: '5' # replying to the command
  voice_assist_not_ready_phase_id: '10' # not ready
  voice_assist_error_phase_id: '11' #encountered an error

  i2s_mclk: GPIO12
  i2s_bclk: GPIO13 #SCLK
  i2s_lrclk: GPIO14 #LRCK/WS

  amp_ctrl: 8 #9 #Extended IO pin that controls the PA_EN on the TCA9555
  i2c_scl: GPIO10
  i2c_sda: GPIO11
  rtc_int: 5 #ExtendedIO

  #mic lookup
  mic_channel_0: 'left'
  mic_channel_1: 'right' # mic wont allow right
  mic_channel_2: 'stereo' # voice assistant does not support stereo

  #WORKING
  i2s_sample_rate: 16000 # Works as in sync with microphone (mic must have 16000 for voice assistant)
  #i2s_bits_per_sample: 32
  i2s_bits_per_sample: 16
  i2s_mode_mic: secondary
  i2s_mode_speaker: secondary
  i2s_use_apll: true
  i2s_bps_spk: 16bit
  i2s_bps_mic: 16bit
  i2s_mclk_multiple: 256 # 128, 256, 384, 512

  hidden_ssid: "false"
  led_num: '7' # WS2812 ring leds

esphome:
  name: $device_name
  friendly_name: $friendly
  min_version: 2025.8.0
  on_boot:
    - priority: -100
      then:
        - if:
            condition:
              switch.is_on: diag_disable_mic
            then:
              - logger.log: "Mic ENABLED"
            else:
              - logger.log: "Mic DISABLED for diagnostics"
              - micro_wake_word.stop:
              - voice_assistant.stop:
              - microphone.stop_capture: i2s_mics
    - priority: 375
      then:
        - sensor.template.publish:
            id: next_timer
            state: -1
        - script.execute: control_leds
        - delay: 10min
        - if:
            condition:
              lambda: return id(init_in_progress);
            then:
              - lambda: id(init_in_progress) = false;
              - script.execute: control_leds
    - priority: -100
      then:
        - lambda: |-
            id(alarm_time).publish_state(id(saved_alarm_time));
        - lambda: |-
            auto call = id(alarm_action).make_call();
            call.set_option(id(saved_alarm_action));
            call.perform();
        - lambda: |-
            setenv("TZ", id(saved_time_zone).c_str(), 1);
            tzset();

esp32:
  board: esp32-s3-devkitc-1
  cpu_frequency: 240MHz
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: esp-idf
    version: recommended
    sdkconfig_options:
      CONFIG_ESP32S3_DATA_CACHE_64KB: "y"
      CONFIG_ESP32S3_DATA_CACHE_LINE_64B: "y"
      CONFIG_ESP32S3_INSTRUCTION_CACHE_32KB: "y"

      # Considerably speeds up mWW at the cost of using more PSRAM.
      CONFIG_SPIRAM_RODATA: "y"
      CONFIG_SPIRAM_FETCH_INSTRUCTIONS: "y"

      CONFIG_BT_ALLOCATION_FROM_SPIRAM_FIRST: "y"
      CONFIG_BT_BLE_DYNAMIC_ENV_MEMORY: "y"

      CONFIG_MBEDTLS_EXTERNAL_MEM_ALLOC: "y"
      CONFIG_MBEDTLS_SSL_PROTO_TLS1_3: "y"  # TLS1.3 support isn't enabled by default in IDF 5.1.5

wifi:
  id: wifi_id
  fast_connect: "true"
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  output_power: 20
  post_connect_roaming: false
  power_save_mode: none  # Disable power saving for better performance
  reboot_timeout: 10min  # Prevent unnecessary reboots
  domain: ".lan"          # Change from default .local
  on_connect:
    - lambda: id(improv_ble_in_progress) = false;
    - script.execute: control_leds
  on_disconnect:
    - script.execute: control_leds

#network:
#  enable_ipv6: true

debug:
  update_interval: 5s

logger:
  level: DEBUG

udp:
  id: broadcast_udp
  addresses:
    - $udp_broadcast_ip          
  port: $udp_broadcast_port      # Same port for listen + send

  on_receive:
    then:
       - lambda: |-
          if (data.size() != 4) 
          {
            ESP_LOGW("udprx", "Arb: Packet size!=4: %d bytes", data.size());
            return;
          }
          //ESP_LOGI("udprx", "Arb Bytes: %02X %02X %02X %02X", data[0], data[1], data[2], data[3]);
          if ((data[0]!=0xaa) || (data[3]!=0x55))
          {
            ESP_LOGW("udprx", "Arb: Packet check patterns incorrect");
            return;
          }
          ESP_LOGI("udprx", "Arb: Received Probability=%d Priority=%d", data[1], data[2]);
          if (data[1] < id(arb_probability))
          {
            return;
          }
          if (data[1] == id(arb_probability))
          {
            if (data[2] <= id(arb_priority))
            {
              return;
            }
          }
          id(arb_probability) = data[1];
          id(arb_priority)    = data[2];
          ESP_LOGI("udprx", "Arb: Highest  Probability=%d Priority=%d", id(arb_probability), id(arb_priority));

api:
  id: api_id
  actions:
    - action: set_led_color
      variables:
        red: float
        green: float
        blue: float
      then:
        - lambda: |-
            id(led_ring_color_r) = std::min(1.0f, std::max(0.0f, red));
            id(led_ring_color_g) = std::min(1.0f, std::max(0.0f, green));
            id(led_ring_color_b) = std::min(1.0f, std::max(0.0f, blue));
    - action: start_va
      then:
        - voice_assistant.start
    - action: stop_va
      then:
        - voice_assistant.stop
    - action: set_alarm_time
      variables:
        alarm_time_hh_mm: string
      then:
        - lambda: |-
            if (alarm_time_hh_mm.length() == 5 &&
              isdigit(alarm_time_hh_mm[0]) && isdigit(alarm_time_hh_mm[1]) &&
              isdigit(alarm_time_hh_mm[3]) && isdigit(alarm_time_hh_mm[4])) {
                id(alarm_time).publish_state(alarm_time_hh_mm);
                id(saved_alarm_time) = alarm_time_hh_mm;
              }
    - action: set_time_zone
      variables:
        posix_time_zone: string
      then:
        - lambda: |-
            setenv("TZ", posix_time_zone.c_str(), 1);
            tzset();
            id(saved_time_zone) = posix_time_zone;
            id(publish_current_time).execute();
  on_client_connected:
    - lambda: |-
        id(adc_mic).set_mic_mute(false);
        ESP_LOGI("api", "on_client_connected: mic_mute=%d", id(adc_mic).mic_mute());
        id(adc_mic).set_mic_gain(id(mic_gain_db).state);
        ESP_LOGI("api", "on_client_connected: mic_gain=%.0f", id(adc_mic).mic_gain());
    - script.execute: control_leds
  on_client_disconnected:
    - script.execute: control_leds

  encryption:
    key: !secret api_key

# http_request: 
#   verify_ssl: false

ota:
  - platform: esphome
    id: ota_esphome
    password: !secret ota_password

i2c:
  - id: internal_i2c
    sda: GPIO11
    scl: GPIO10
    scan: true
    frequency: 100kHz

# I/O Expander that controls the amplifier enable pin
tca9555:
  id: ioexp
  i2c_id: internal_i2c
  address: 0x20

psram:
  mode: octal
  speed: 80MHz

time:
  - platform: homeassistant
  #- platform: pcf85063
    id: rtc
  #  address: 0x51
    #RTC_INT = $rtc_int # extIO 5
  #  i2c_id: internal_i2c

    on_time:
      - seconds: 0
        minutes: /1
        then:
          - script.execute: check_alarm
    on_time_sync:
      - script.execute: publish_current_time

light:
  - platform: esp32_rmt_led_strip
    id: status_ring
    name: "Status Ring"
    pin: GPIO38
    num_leds: ${led_num}
    chipset: WS2812
    rgb_order: RGB
    default_transition_length: 150ms
    effects:
      - pulse:
          name: "Pulse Slow"
          min_brightness: 30%
          max_brightness: 100%
          transition_length: 2000ms
          update_interval: 3000ms
      - pulse:
          name: "Pulse Medium"
          min_brightness: 30%
          max_brightness: 100%
          transition_length: 600ms
          update_interval: 1200ms
      - pulse:
          name: "Pulse Fast"
          min_brightness: 30%
          max_brightness: 100%
          transition_length: 300ms
          update_interval: 600ms
      - addressable_rainbow:
          name: "Rainbow Slow"
          speed: 6
          width: 7
      - addressable_color_wipe:
          name: "Wipe"

i2s_audio:
  - id: i2s_output
    i2s_lrclk_pin: 
      number: $i2s_lrclk
      allow_other_uses: true
    i2s_bclk_pin:  
      number: $i2s_bclk
      allow_other_uses: true
    i2s_mclk_pin:
      number: $i2s_mclk

  - id: i2s_input
    i2s_lrclk_pin:  
      number: $i2s_lrclk
      allow_other_uses: true
    i2s_bclk_pin:  
      number: $i2s_bclk
      allow_other_uses: true

audio_adc:
  - platform: es7210
    id: adc_mic
    i2c_id: internal_i2c
    sample_rate: $i2s_sample_rate
    bits_per_sample: $i2s_bps_mic
    #bits_per_sample: "${i2s_bits_per_sample}bit"

external_components:
#  - source:
#      type: local
#      path: components
#    components: 
#      - es7210
#      - micro_wake_word
#      - es8311

  - source:
      type: git
      url: "https://github.com/sw3Dan/waveshare-s2-audio_esphome_voice"
      ref: main
    components: [ es8311 ]
    refresh: 0s

  - source:
      type: git
      url: "https://github.com/ldiebel/waveshare-s2-audio_esphome_voice"
      ref: main
    components:
      - es7210
      - micro_wake_word
    refresh: 0s

 get TaterTotterson micro_wake_word code that uploads Wake Word samples
  - source:
