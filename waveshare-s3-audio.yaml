      ref: main
      path: shared/components
    components:
      - micro_wake_word
    refresh: 0s

audio_dac:
  - platform: es8311
    id: es8311_dac
    i2c_id: internal_i2c
    use_mclk: true
    sample_rate: $i2s_sample_rate
    bits_per_sample: $i2s_bps_spk
    #bits_per_sample: "${i2s_bits_per_sample}bit"
    force_master: true
    mclk_multiple: $i2s_mclk_multiple

microphone:
  - platform: i2s_audio
    id: i2s_mics
    i2s_din_pin: GPIO15
    adc_type: external
    pdm: false
    i2s_audio_id: i2s_input
    i2s_mode: $i2s_mode_mic

    #sample_rate: $i2s_sample_rate
    sample_rate: 16000

    bits_per_sample: $i2s_bps_mic
    #bits_per_sample: "${i2s_bits_per_sample}bit"

    use_apll: $i2s_use_apll
    mclk_multiple: $i2s_mclk_multiple
    #channel: stereo
    channel: $mic_select

speaker:
  - platform: i2s_audio
    id: i2s_audio_speaker
    i2s_dout_pin: GPIO16
    
    i2s_audio_id: i2s_output
    i2s_mode: secondary #using the patched es8311

    dac_type: external
    timeout: never
    buffer_duration: 100ms
    audio_dac: es8311_dac
    sample_rate: $i2s_sample_rate
    #bits_per_sample: "${i2s_bits_per_sample}bit"
    #bits_per_sample: $i2s_bps_spk
    bits_per_sample: 16bit #TEMP FIX
    use_apll: $i2s_use_apll
    mclk_multiple: $i2s_mclk_multiple
    #channel: mono #WORKS
    channel: stereo #WORKS #TEST: STREAM ERROR

  # Virtual speakers to combine the announcement and media streams together into one output
  - platform: mixer
    id: mixing_speaker
    output_speaker: i2s_audio_speaker
    num_channels: 2
    source_speakers:
      - id: announcement_mixing_input
        timeout: never
      - id: media_mixing_input
        timeout: never

  # Vritual speakers to resample each pipelines' audio, if necessary, as the mixer speaker requires the same sample rate
  - platform: resampler
    id: announcement_resampling_speaker
    output_speaker: announcement_mixing_input
  - platform: resampler
    id: media_resampling_speaker
    output_speaker: media_mixing_input

media_player:
  - platform: speaker
    id: external_media_player
    name: None
    internal: False
    volume_increment: 0.01
    volume_min: 0.4
    volume_max: 0.8
    announcement_pipeline:
      speaker: announcement_resampling_speaker
      format: FLAC     # FLAC is the least processor intensive codec
      num_channels: 1  # Stereo audio is unnecessary for announcements
#      sample_rate: 48000 #Supported by Music Assistant
      sample_rate: 16000 #Supported by Music Assistant
    buffer_size: 2097152 # Increase from default 1MB; try 1.5M–4M (max ~4M). Helps with network jitter / slow starts.<grok-card data-id="095a27" data-type="citation_card" data-plain-type="" ></grok-card>
    media_pipeline:
      speaker: media_resampling_speaker
      format: FLAC     # FLAC is the least processor intensive codec
      sample_rate: 48000
    on_announcement:
      - lambda: |-
          id(adc_mic).set_mic_mute(true);
          ESP_LOGI("media_player", "on_announcement: mic_mute=%d", id(adc_mic).mic_mute());
    on_idle:
      - lambda: |-
          if (!id(mic_mute_switch).state)
          {
            id(adc_mic).set_mic_mute(false);
          }
          ESP_LOGI("media_player", "on_idle: mic_mute=%d mic_mute_switch=%d", id(adc_mic).mic_mute(), id(mic_mute_switch).state);
#    on_state:

    on_mute:
      - delay: 100ms  # Debounce
      - script.execute: control_leds_volume_changed
    on_unmute:
      - delay: 100ms  # Debounce
      - script.execute: control_leds_volume_changed
    on_volume:
      if:
        condition:
          - lambda: return !id(init_in_progress);
        then:  
          - delay: 100ms  # Debounce
          - script.execute: control_leds_volume_changed
    files:
      - id: timer_finished_sound
#        file: /config/esphome/media/TTS_TimerExpired.flac
        file: https://github.com/ldiebel/waveshare-s2-audio_esphome_voice/raw/refs/heads/main/media/TTS_TimerExpired.flac

      - id: wake_word_triggered_sound1
#        file: /config/esphome/media/TTS_Im_Here.flac
        file: https://github.com/ldiebel/waveshare-s2-audio_esphome_voice/raw/refs/heads/main/media/TTS_Im_Here.flac

      - id: wake_word_triggered_sound2
#        file: /config/esphome/media/TTS_GrokHere.flac
        file: https://github.com/ldiebel/waveshare-s2-audio_esphome_voice/raw/refs/heads/main/media/TTS_GrokHere.flac

      - id: progress_sound
#        file: /config/esphome/media/progress_sound.flac
        file: https://github.com/esphome/home-assistant-voice-pe/raw/dev/sounds/wake_word_triggered.flac

      - id: error_cloud_expired
#        file: /config/esphome/media/sounds_error_cloud_expired.mp3
        file: https://github.com/esphome/home-assistant-voice-pe/raw/dev/sounds/error_cloud_expired.mp3

voice_assistant:
  id: va
  microphone:
    id: va_mic
    microphone: i2s_mics
    #channels: 1 #Right
    #channels: 0 #Left
    channels:  0 # $which_mic #correct that it's left/right channel OR number of channels?
  media_player: external_media_player
  micro_wake_word: mww
  use_wake_word: false
  noise_suppression_level: 0 #2 #0
  auto_gain: 0 dbfs
  volume_multiplier: 1
  on_client_connected:
    - switch.turn_off: mic_mute_switch
    - lambda: id(init_in_progress) = false;
    - lambda: |-
        id(mww).set_capture_upload_enabled(id(capture_wake_audio).state);
        id(mww).set_capture_close_misses_enabled(id(capture_close_misses).state);
        id(mww).set_capture_close_miss_probability_cutoff(id(close_miss_threshold).state);
        //id(mww).set_detection_profile(id(wake_word_profile).state);
        id(mww).set_detection_profile(id(wake_word_profile).current_option());
        if (id(wake_word_sensitivity).current_option() == "Slightly sensitive") {
          id(mww).set_wake_word_probability_cutoff(${wake_cutoff_slight});
        } else if (id(wake_word_sensitivity).current_option() == "Moderately sensitive") {
          id(mww).set_wake_word_probability_cutoff(${wake_cutoff_moderate});
        } else if (id(wake_word_sensitivity).current_option() == "Very sensitive") {
          id(mww).set_wake_word_probability_cutoff(${wake_cutoff_very});
        }
        id(mww).set_capture_upload_url(id(trainer_app_url).state);
        ESP_LOGI("adc_mic", "on_client_connect: mic_gain=%.0f", id(adc_mic).mic_gain());

    - lambda: id(voice_assistant_phase) = ${voice_assist_idle_phase_id};
    - micro_wake_word.start:
    - script.execute: control_leds
    - safe_mode.mark_successful		# tater micro_wake_word won't start until successful boot

  on_client_disconnected:
    - voice_assistant.stop:
    - lambda: id(voice_assistant_phase) = ${voice_assist_not_ready_phase_id};
    - script.execute: control_leds
  on_error:
    # Only set the error phase if the error code is different than duplicate_wake_up_detected or stt-no-text-recognized
    # These two are ignored for a better user experience
    - if:
        condition:
          and:
            - lambda: return !id(init_in_progress);
            - lambda: return code != "duplicate_wake_up_detected";
            - lambda: return code != "stt-no-text-recognized";
        then:
          - lambda: id(voice_assistant_phase) = ${voice_assist_error_phase_id};
          - script.execute: control_leds
    # If the error code is cloud-auth-failed, serve a local audio file guiding the user.
    - if:
        condition:
          - lambda: return code == "cloud-auth-failed";
        then:
          - script.execute:
              id: play_sound
              priority: true
              sound_file: !lambda return id(error_cloud_expired);
  # When the voice assistant starts: Play a wake up sound, duck audio.
#  on_start:

  on_listening:
    - lambda: id(voice_assistant_phase) = ${voice_assist_waiting_for_command_phase_id};
    - script.execute: control_leds
  on_stt_vad_start:
    - lambda: id(voice_assistant_phase) = ${voice_assist_listening_for_command_phase_id};
    - script.execute: control_leds
  on_stt_vad_end:
    - lambda: id(voice_assistant_phase) = ${voice_assist_thinking_phase_id};
    - script.execute: control_leds
  on_intent_progress:
    - if:
        condition:
          # A nonempty x variable means a streaming TTS url was sent to the media player
          lambda: 'return !x.empty();'
        then:
          - lambda: id(voice_assistant_phase) = ${voice_assist_replying_phase_id};
          - script.execute: control_leds
          # Start a script that would potentially enable the stop word if the response is longer than a second
          - script.execute: activate_stop_word_once
  on_tts_start:
    - if:
        condition:
          # The intent_progress trigger didn't start the TTS Reponse
          lambda: 'return id(voice_assistant_phase) != ${voice_assist_replying_phase_id};'
        then:
          - lambda: id(voice_assistant_phase) = ${voice_assist_replying_phase_id};
          - script.execute: control_leds
          # Start a script that would potentially enable the stop word if the response is longer than a second
          - script.execute: activate_stop_word_once
  on_tts_end:
    - script.execute:
        id: send_tts_uri_event
        tts_uri: !lambda 'return x;'
  on_stt_end:
    - script.execute:
        id: send_stt_text_event
        stt_text: !lambda 'return x;'
    
  # When the voice assistant ends ...
  on_end:
    - wait_until:
        not:
          voice_assistant.is_running:

    # If the end happened because of an error, let the error phase on for a second
    - if:
        condition:
          lambda: return id(voice_assistant_phase) == ${voice_assist_error_phase_id};
        then:
          - delay: 1s
    # Reset the voice assistant phase id and reset the LED animations.
    - lambda: id(voice_assistant_phase) = ${voice_assist_idle_phase_id};
    - script.execute: control_leds
  on_timer_finished:
    - switch.turn_on: timer_ringing
    - lambda: |
        id(next_timer).publish_state(-1);
        id(next_timer_name).publish_state("-");
  on_timer_started:
    - lambda: |
        id(check_if_timers_active).execute();
        if (id(is_timer_active)) {
          id(fetch_first_active_timer).execute();
          id(next_timer).publish_state(id(first_active_timer).seconds_left);
          id(next_timer_name).publish_state(id(first_active_timer).name);
        }
    - script.execute: control_leds
  on_timer_cancelled:
    - lambda: |
        id(check_if_timers_active).execute();
        if (id(is_timer_active)) {
          id(fetch_first_active_timer).execute();
          id(next_timer).publish_state(id(first_active_timer).seconds_left);
          id(next_timer_name).publish_state(id(first_active_timer).name);
        } else {
          id(next_timer).publish_state(-1);
          id(next_timer_name).publish_state("-");
        }
    - script.execute: control_leds
  on_timer_updated:
    - lambda: |
        id(check_if_timers_active).execute();
        if (id(is_timer_active)) {
          id(fetch_first_active_timer).execute();
          id(next_timer).publish_state(id(first_active_timer).seconds_left);
          id(next_timer_name).publish_state(id(first_active_timer).name);
        }
    - script.execute: control_leds
  on_timer_tick:
    - lambda: |
        id(fetch_first_active_timer).execute();
        int seconds_left = id(first_active_timer).seconds_left;
        if (seconds_left % 5 == 0) {
          id(next_timer).publish_state(seconds_left);
        }
        // LED updates are handled centrally by control_leds()

micro_wake_word:
  id: mww
  microphone:
    microphone: i2s_mics
    channels: 0  # $which_mic
    #gain_factor: 4
  stop_after_detection: false
  models:
    - model: $wake1_model
      id:    $wake1_id
    - model: $wake2_model
      id:    $wake2_id
    - model: hey_jarvis
      id: hey_jarvis
    - model: /config/esphome/wakewords/stop.json
      id: stop
      internal: true #false
  vad:
    probability_cutoff: 0.03 # default 0.5

  on_wake_word_detected:
    # initialize received probability and priority as soon as possible after wake detected 
    # so we're ready for arb packets from other devices
    - lambda: |-
        id(arb_probability)=0; id(arb_priority)=0;
        ESP_LOGI("micro_wake_word", "on_wake_word_detected: %d ", id(mww).average_probability);

    # If a timer is ringing: Stop it, do not start the voice assistant (We can stop timer from voice!)
    - if:
        condition:
          switch.is_on: timer_ringing
        then:
          - switch.turn_off: timer_ringing
        else:
          # Stop voice assistant if running
          - if:
              condition:
                voice_assistant.is_running:
              then:
                voice_assistant.stop:
              else:
                # Stop any other media player announcement
                - if:
                    condition:
                      media_player.is_announcing:
                    then:
                      - media_player.stop:
                          announcement: true
                    else:
                      # Send out device arbitration udp broadcast packets to detirmine which device wins and gets to respond
                      - repeat:
                          count: !lambda 'return $udp_send_count;'
                          then:
                            - udp.write:  # send 3 broadcasts since non-confirmed delivery and timing variances between devices
                                id: broadcast_udp
                                data: !lambda |-
                                  return std::vector<uint8_t>{
                                      0xaa,
                                      (uint8_t)id(mww).average_probability,
                                      (uint8_t)$wake_word_priority,
                                      0x55
                                    };
                            # Delay only if this is NOT the last iteration
                            - if:
                                condition:
                                  lambda: 'return iteration < ($udp_send_count-1);'
                                then:
                                  - delay: $udp_send_delay
                      
                      - lambda: |-
                          if ($udp_send_count)
                          {
                            ESP_LOGI("udptx", "Arb: Sent Probability=%d Priority=%d count=%d delay=%s", 
                            id(mww).average_probability, $wake_word_priority, $udp_send_count, "$udp_send_delay");
                          }

                      # while we've been sending, we may have received arbitration packets from other devices
                      # if received probability is greater than ours, we lose.
                      # if probability is equal, check received device priority against ours
                      - lambda: |-
                          if (!$udp_send_count)
                          {
                            id(we_win) = true;
                            return;
                          }
                          id(we_win) = false;
                          if (id(arb_probability) > id(mww).average_probability)
                          {
                            ESP_LOGI("micro_wake_word", "We Lose. Heard Probability (%d) > ours (%d)", id(arb_probability), id(mww).average_probability);
                            return;
                          }
                          if ( (id(arb_probability) == id(mww).average_probability) && (id(arb_priority) > $wake_word_priority) )
                          {
                            ESP_LOGI("micro_wake_word", "We Lose. Heard Priority (%d) > ours (%d)", id(arb_priority), $wake_word_priority);
                            return;
                          }
                          id(we_win) = true;
                          ESP_LOGI("micro_wake_word", "We Win! Heard Probability (%d) / ours (%d), Heard Priority (%d) / ours (%d)", 
                            id(arb_probability), id(mww).average_probability, id(arb_priority), $wake_word_priority);
                      - if:
                          condition:
                            lambda: 'return id(we_win);'
                          then:       
                            # Start the voice assistant and play the wake sound, if enabled
                            - if:
                                condition:
                                  switch.is_on: wake_sound
                                then:
                                  - if:
                                      condition:
                                        lambda: 'return wake_word == "${wake2_name}";'
                                      then:
                                        - script.execute:
                                            id: play_sound
                                            priority: true
                                            sound_file: !lambda return id(wake_word_triggered_sound2);
                                      else:
                                        - script.execute:
                                            id: play_sound
                                            priority: true
                                            sound_file: !lambda return id(wake_word_triggered_sound1);
                                  - delay: 300ms
                            - voice_assistant.start:
                                wake_word: !lambda return wake_word;

globals:
  - id: led_ring_color_r
    type: float
    restore_value: yes
    initial_value: '1.0'
  - id: led_ring_color_g
    type: float
    restore_value: yes
    initial_value: '0.0'
  - id: led_ring_color_b
    type: float
    restore_value: yes
    initial_value: '1.0'
  - id: init_in_progress
    type: bool
    restore_value: no
    initial_value: 'true'
  - id: improv_ble_in_progress
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: voice_assistant_phase
    type: int
    restore_value: no
    initial_value: ${voice_assist_not_ready_phase_id}
  - id: saved_alarm_time
    type: std::string
    restore_value: yes
    initial_value: '"Unknown"'
  - id: saved_time_zone
    type: std::string
    restore_value: yes
    initial_value: '"UTC0"'
  - id: saved_alarm_action
    type: std::string
