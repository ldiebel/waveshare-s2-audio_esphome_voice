          args: ["x"]

  - platform: template
    id: led_ring_brightness
    name: "LED Ring Brightness"
    icon: mdi:brightness-6
    entity_category: config
    optimistic: true
    restore_value: true
    min_value: 0.4
    max_value: 1.0
    step: 0.05
    initial_value: 0.8
    mode: slider
    on_value:
      - if:
          condition:
            light.is_on: status_ring
          then:
            - light.turn_on:
                id: status_ring
                brightness: !lambda 'return x;'


sensor:
  - platform: template
    id: next_timer
    name: "Next timer"
    update_interval: never
    disabled_by_default: true
    device_class: duration
    unit_of_measurement: s
    icon: "mdi:timer"
    accuracy_decimals: 0

  - platform: wifi_signal
    name: "WiFi Signal dBm"
    id: wifi_signal_dbm
    update_interval: 60s
    entity_category: "diagnostic"
    icon: "mdi:wifi"

text_sensor:
  - platform: template
    id: next_timer_name
    name: "Next timer name"
    icon: "mdi:timer"
    disabled_by_default: true
  - platform: template
    name: "Alarm time"
    id: alarm_time
    icon: mdi:bell-ring
  - platform: template
    name: "Current device time"
    id: current_time
    icon: mdi:clock

button:
  - platform: factory_reset
    id: factory_reset_button
    name: "Factory Reset"
    entity_category: diagnostic
    internal: true
  - platform: restart
    id: restart_button
    name: "Restart"
    entity_category: config
    disabled_by_default: true
    icon: "mdi:restart"

binary_sensor:
  - platform: gpio
    id: key1_button
    name: "Key1"
    pin:
      tca9555: ioexp
      number: 9 # not '12' as schematics say!
      inverted: true
    on_press:
      - media_player.volume_down: external_media_player

  - platform: gpio
    id: key2_button
    name: "Key2"
    pin:
      tca9555: ioexp
      number: 10
      inverted: true
    on_press:
    - if:
        condition:
          - switch.is_on: mic_mute_switch
        then:
          - switch.turn_off: mic_mute_switch
          - script.execute: control_leds
        else:
          - switch.turn_on: mic_mute_switch
          - script.execute: control_leds
#      - media_player.toggle: external_media_player

  - platform: gpio
    id: key3_button
    name: "Key3"
    pin:
      tca9555: ioexp
      number: 11
      inverted: true
    on_press:
      - media_player.volume_up: external_media_player
